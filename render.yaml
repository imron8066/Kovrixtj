# Render Blueprint: Telegram-бот Kovrix работает 24/7 без ноутбука.
# Render → New → Blueprint → репозиторий Kovrixtj. Секреты (sync: false)
# Render спросит при создании — значения из bot/.env.
services:
  - type: worker
    name: kovrix-bot
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: "true"
    startCommand: node bot/bot.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: FIREBASE_KEY
        sync: false
      - key: FIREBASE_DB
        sync: false
      - key: BOT_EMAIL
        sync: false
      - key: BOT_PASSWORD
        sync: false
