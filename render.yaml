# Render Blueprint: Telegram-бот Kovrix работает 24/7 без ноутбука.
# Render → New → Blueprint → репозиторий Kovrixtj. Секреты (sync: false)
# Render спросит при создании — значения из bot/.env.
services:
  # бесплатный тариф: web-сервис, который будит пинг каждые 10 минут
  # (cron-job.org → https://kovrix-bot.onrender.com); worker бесплатно нельзя
  - type: web
    name: kovrix-bot
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: "true"
    startCommand: node bot/bot.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: FIREBASE_KEY
        sync: false
      - key: FIREBASE_DB
        sync: false
      - key: BOT_EMAIL
        sync: false
      - key: BOT_PASSWORD
        sync: false
